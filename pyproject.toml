[project]
name = "quantum-developer-agent"
version = "1.0.0"
description = "Quantum Developer Agent - Expert in quantum code generation and explanations"
readme = "README.md"
authors = [{ name = "Edgar Bruney" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "agentstack-sdk==0.4.0rc1",
    "beeai_framework>=0.1.76",
    "python-dotenv>=1.0.0",
    "mcp>=1.12.3,<2.0.0",
    "uvicorn<0.36.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "quantum_developer_agent.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"